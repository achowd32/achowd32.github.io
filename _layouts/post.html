---
layout: default
---
<article class="post">
  <h1 class="light-blue no-margin">{{ page.title }}</h1>
  {% if page.subtitle %}
    <p class="post-subtitle">{{ page.subtitle }}</p>
  {% endif %}
  <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← back to blog</a></p>
</article>
